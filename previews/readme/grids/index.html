<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>README four-panel city galleries</title>
<style>*{box-sizing:border-box}
html,body{margin:0;background:#e6e9e5}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{padding:0;font-family:Arial,Helvetica,sans-serif;color:#edf0e2}
.grid{width:1600px;padding:16px;background:#1b302c;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 32px}
figure{margin:0;overflow:hidden;background:#263e37}
img{display:block;width:100%;height:414px;object-fit:contain}
figcaption{height:72px;display:flex;align-items:center;gap:15px;padding:12px 20px;border-top:1px solid #81948755}
.number{font-size:18px;letter-spacing:1px;color:#d8bf85;align-self:center}
strong{display:block;font-family:Georgia,serif;font-size:25px;font-weight:400;line-height:1.2;white-space:nowrap}
small{display:block;margin-top:5px;font-size:15px;line-height:1.2;color:#ccd5c6}
</style>
<body>
<section class="grid" id="cities" aria-label="cities four-panel collage">

<small>Coastal city</small>
</div>
</figcaption>
