 function sector(k,inner,outer,bottom,top,a,b,m='wall',steps=6){

   k.quad(P(outer,bottom,u),P(outer,bottom,v),P(outer,top,v),P(outer,top,u),m);
   k.quad(P(inner,bottom,u),P(inner,top,u),P(inner,top,v),P(inner,bottom,v),m);
  }
